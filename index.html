<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6C6DD">
<title>Letterz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="sky" aria-hidden="true"></div>

  <!-- Home: all the letters -->
  <main id="home" class="screen active">
    <header class="top">
      <h1 class="title">אוֹתִיּוֹת</h1>
      <div class="modes">
        <button id="namesBtn" class="pill" aria-label="השם שלי">✏️ השם שלי</button>
        <button id="storyBtn" class="pill" aria-label="סיפור">📖 סיפור</button>
      </div>
    </header>
    <div id="grid"></div>
  </main>

  <!-- Stage: one letter, big and alive -->
  <section id="stage" class="screen" aria-live="polite">
    <div id="stageBg"></div>
    <button class="round back" data-go="home" aria-label="בית">🏠</button>
    <div id="hero" class="hero"><div class="hero-inner"></div><div class="shadow"></div></div>
    <div id="caption" class="caption"></div>
    <button id="spark" aria-label="ניצוץ"></button>
    <div id="storyCard" class="story-card"></div>
    <button class="round nav prev" id="prevBtn" aria-label="הקודמת">➡️</button>
    <button class="round nav next" id="nextBtn" aria-label="הבאה">⬅️</button>
  </section>

  <!-- Name builder -->
  <section id="names" class="screen">
    <button class="round back" data-go="home" aria-label="בית">🏠</button>
    <div class="grownup">
      <label for="nameInput">שם:</label>
      <input id="nameInput" type="text" maxlength="10" autocomplete="off" placeholder="אפשר להקליד שם">
      <button id="clearBtn" class="pill small" aria-label="להתחיל מחדש">↺</button>
    </div>
    <div id="nameRow"><svg id="arms" aria-hidden="true"></svg><div id="slots"></div></div>
    <div id="nameShow"></div>
    <div id="tray"></div>
  </section>

  <script src="letters.js"></script>
  <script src="rigs.js"></script>
  <script src="story.js"></script>
  <script src="app.js"></script>
  <script src="names.js"></script>
</body>
</html>
